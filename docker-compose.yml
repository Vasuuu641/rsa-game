services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  stats:
    build:
      context: ./services/stats
      dockerfile: Dockerfile
    container_name: stats-service
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  match:
    build:
      context: ./services/match
      dockerfile: Dockerfile
    container_name: match-service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: