services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_db
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8000"
    environment:
      JWT_SECRET: dev-secret-change-me
      MATCH_SERVICE_URL: http://match:8000
    depends_on:
      - match
    restart: unless-stopped

  crypto:
    build:
      context: ./services/crypto
      dockerfile: Dockerfile
    container_name: crypto-service
    ports:
      - "8003:8000"
    restart: unless-stopped

  match:
    build:
      context: ./services/match
      dockerfile: Dockerfile
    container_name: match-service
    ports:
      - "8002:8000"
    environment:
      CRYPTO_SERVICE_URL: http://crypto:8000
      REDIS_URL: redis://redis:6379/0
      STATS_SERVICE_URL: http://stats:8000
    depends_on:
      redis:
        condition: service_healthy
      crypto:
        condition: service_started
      stats:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth:8000
      MATCH_SERVICE_URL: http://match:8000
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      match:
        condition: service_started
    restart: unless-stopped

  stats:
    build:
      context: ./services/stats
      dockerfile: Dockerfile
    container_name: stats-service
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: